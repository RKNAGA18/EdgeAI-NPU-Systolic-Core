# Tiny Tapeout project information
project:
  title:        "Edge-AI NPU Core (8x8 Systolic Array)"
  author:       "R Naga Arjun"
  discord:      ""      # Leave blank if you don't use Discord
  description:  "INT8 Matrix Multiplication Engine with Weight-Stationary Dataflow."
  language:     "Verilog"
  clock_hz:     50000000       # 50 MHz target frequency

  # We are starting with 1x1 to prove the layout works before scaling up
  tiles: "6x6"          

  # MUST match your GitHub username and Verilog module name exactly
  top_module:  "tt_um_npu_core"

  source_files:
    - "input_buffer.sv"
    - "processing_element.sv"
    - "systolic_array_8x8.sv"
    - "tt_um_npu_core.sv"

# The pinout of your project. 
pinout:
  # 8-bit Data Input Bus (Streaming weights and activations)
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # 8-bit Data Output Bus (Multiplexed accumulator results)
  uo[0]: "mux_out[0]"
  uo[1]: "mux_out[1]"
  uo[2]: "mux_out[2]"
  uo[3]: "mux_out[3]"
  uo[4]: "mux_out[4]"
  uo[5]: "mux_out[5]"
  uo[6]: "mux_out[6]"
  uo[7]: "mux_out[7]"

  # Control Signals (Hardware Multiplexer and Memory Locks)
  uio[0]: "weight_load_en (1 to lock memory)"
  uio[1]: "buffer_cs (1 to turn on staging buffer)"
  uio[2]: "col_sel[0] (Multiplexer Column Select)"
  uio[3]: "col_sel[1]"
  uio[4]: "col_sel[2]"
  uio[5]: "byte_sel[0] (Multiplexer Byte Select)"
  uio[6]: "byte_sel[1]"
  uio[7]: ""

# Do not change!
yaml_version: 6
