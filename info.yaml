# Tiny Tapeout project information
project:
  title:        "Edge-AI NPU Core (8x Systolic Array)"
  author:       "R Naga Arjun"
  discord:      ""      # Leave blank if you don't use Discord
  description:  "INT8 Matrix Multiplication Engine with Weight-Stationary Dataflow."
  language:     "Verilog"
  clock_hz:     50000000       # 50 MHz target frequency

  # We are starting with 1x1 to prove the layout works before scaling up
  tiles: "1x1"          

  # MUST match your GitHub username and Verilog module name exactly
  top_module:  "tt_um_npu_core"

  source_files:
    - "input_buffer.sv"
    - "processing_element.sv"
    - "systolic_array_8x8.sv"
    - "tt_um_npu_core.sv"

# The pinout of your project. 
pinout:
  # 8-bit Data Input Bus (Streaming weights and activations)
  ui[0]: "data_in[0]"
  ui[1]: "data_in[1]"
  ui[2]: "data_in[2]"
  ui[3]: "data_in[3]"
  ui[4]: "data_in[4]"
  ui[5]: "data_in[5]"
  ui[6]: "data_in[6]"
  ui[7]: "data_in[7]"

  # 8-bit Data Output Bus (Streaming accumulator results)
  uo[0]: "data_out[0]"
  uo[1]: "data_out[1]"
  uo[2]: "data_out[2]"
  uo[3]: "data_out[3]"
  uo[4]: "data_out[4]"
  uo[5]: "data_out[5]"
  uo[6]: "data_out[6]"
  uo[7]: "data_out[7]"

  # Control Signals (Telling the NPU what to do)
  uio[0]: "weight_load"  # Set to 1 to load weights into the PEs
  uio[1]: "compute_en"   # Set to 1 to start multiplying
  uio[2]: "acc_clear"    # Set to 1 to reset the math to 0
  uio[3]: ""             # Unused for now
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
